name: flutter_application_1
description: "Pulse AI — Advanced health intelligence powered by Huawei Health Kit."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4
  supabase_flutter: ^2.6.0
  # Google Health Connect
  health: ^13.3.1
  permission_handler: ^11.3.1
  fl_chart: ^0.68.0
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  http: ^1.2.1
  uuid: ^4.4.0
  path_provider: ^2.1.3
  home_widget: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: any

flutter:
  uses-material-design: true
  assets:
    - .env
